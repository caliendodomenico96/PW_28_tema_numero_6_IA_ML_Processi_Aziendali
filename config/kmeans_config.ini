[LOG]

; Livelli: logging.DEBUG, logging.INFO, logging.WARNING,
; logging.ERROR, logging.CRITICAL
severity = logging.INFO
store_log_file = no
output_log_folder = log


[KMEANS]
; "latest": usa il CSV dell'ultima generazione in data/<timestamp_UTC>/.
; È possibile indicare anche un percorso CSV relativo alla root del progetto.
dataset_csv = latest

; Ogni training crea una nuova sottocartella UTC, senza sovrascritture.
output_dir = results/kmeans

; RFM + anzianità: giorni_da_iscrizione è derivata da data_iscrizione.
; Identificativi, anagrafica, zona e categoria non entrano nel training.
features = numero_richieste, importo_totale_speso, giorni_ultima_richiesta, giorni_da_iscrizione

; L'intervallo per gomito e silhouette comprende tutti i K inclusi.
k_min = 2
k_max = 8

; Almeno due configurazioni esplicitamente da confrontare.
k_confronto = 3, 4
random_state = 42
n_init = 20

; Log(1+x) riduce l'asimmetria degli importi prima dello StandardScaler.
log1p_spesa = yes


[VALIDATION]
; "latest": usa la cartella dell'ultimo training completo.
; In alternativa: results/kmeans/<timestamp_UTC>
training_run = latest
