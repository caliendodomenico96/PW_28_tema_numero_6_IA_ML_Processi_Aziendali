[LOG]

; Livelli: logging.DEBUG, logging.INFO, logging.WARNING,
; logging.ERROR, logging.CRITICAL
severity = logging.INFO
store_log_file = no
output_log_folder = log


[OUTPUT]

; Percorsi relativi alla cartella principale del progetto (non a src/).
; Ogni avvio crea una sottocartella in data/ nominata con timestamp UTC.
; CSV, metadati JSON e richieste facoltative finiscono nella stessa sottocartella.
; Il CSV dei clienti e il relativo file .metadati.json vengono sempre creati.
csv_clienti = data/customer_history_dataset.csv

; Il nome del file è rispettato; viene salvato nella cartella della generazione.
; Esportazione facoltativa della storia completa delle richieste.
; Impostare yes per ottenere anche il CSV sottostante.
esporta_richieste = no
csv_richieste = data/richieste_sintetiche.csv

; Includi nome, cognome, email sintetici nel CSV clienti (yes/no).
; Le email usano solo example.com e NON sono recapiti reali.
includi_anagrafica = yes

; Separatore CSV: virgola (,) o punto e virgola (;).
separatore_csv = ,


[DATASET_GENERATOR]

; Clienti privati di un servizio di assistenza informatica da remoto
; Per la consegna: da 300 a 600 clienti
n_clienti = 600
seed = 1

; Formato GG-MM-AAAA; conversione Python: %d-%m-%Y
data_riferimento = 26-10-2026

giorni_osservazione = 90
giorni_attivita_azienda = 240

; Quota attesa di nuovi clienti tra quelli senza interruzione simulata
quota_nuovi_clienti = 0.15
giorni_cliente_nuovo = 30

; Coefficienti di variazione, ammessi tra 0 e 2
variabilita_frequenza = 0.45
variabilita_ticket_cliente = 0.25
variabilita_ticket_richiesta = 0.35

; Probabilita di utilizzare la categoria target individuale
probabilita_categoria_preferita = 0.75


; Soglie DESCRITTIVE calcolate dopo la simulazione: non cambiano il CSV
; né la generazione dei clienti. Servono a controllare la distribuzione nel JSON.
; Per una finestra di osservazione diversa da 90 giorni, rivalutare le soglie.
[ANALISI_COMPORTAMENTI]
richieste_min_attivi = 3
richieste_min_molto_attivi = 6
ticket_medio_elevato_euro = 70.00


[GEOGRAFIA]

; Nazione di residenza dei clienti simulati
nazione = Italia


[ZONE]

; Citta di residenza e pesi relativi di estrazione
; La citta non limita l'erogazione del servizio, che avviene da remoto
; Distribuzione illustrativa, non basata su dati demografici reali
Roma = 0.25
Milano = 0.20
Napoli = 0.15
Torino = 0.15
Bologna = 0.10
Firenze = 0.10
Palermo = 0.05


; Ogni richiesta rappresenta un intervento completato e pagato
; Le categorie identificano la finalita principale dell'intervento
; Pesi e fattori di prezzo sono ipotesi didattiche, non dati di mercato

[CATEGORIA:Installazione e configurazione software]
peso = 0.35
fattore_prezzo = 1.0

[CATEGORIA:Configurazione posta e account]
peso = 0.25
fattore_prezzo = 0.8

[CATEGORIA:Scansione Anomalie/Vulnerabilità del dispositivo]
peso = 0.20
fattore_prezzo = 1.25

[CATEGORIA:Configurazione backup]
peso = 0.20
fattore_prezzo = 1.1


; Quattro profili LATENTI di FREQUENZA e CONTINUITA, non esportati nel CSV.
; I nuovi clienti sono generati con quota_nuovi_clienti e giorni_cliente_nuovo,
; indipendentemente dal profilo (tranne quello inattivo, con storia precedente).
; I ticket premium sono un tratto economico trasversale, separato dai profili.
; I pesi sono probabilita di simulazione, NON quote garantite nelle fasce osservate.

[PROFILO:molto_attivi]
peso = 0.12
richieste_mese = 2.70
ticket_medio_euro = 38.0

[PROFILO:abituali]
peso = 0.30
richieste_mese = 1.10
ticket_medio_euro = 35.0

[PROFILO:occasionali]
peso = 0.43
richieste_mese = 0.20
ticket_medio_euro = 28.0

[PROFILO:inattivi]
peso = 0.15
richieste_mese = 0.55
ticket_medio_euro = 35.0
; L'interruzione precede il periodo osservato di 90 giorni:
; nessuna richiesta dopo lo stop (pur conservando acquisti storici).
inattivita_giorni_min = 100
inattivita_giorni_max = 160


; Valore economico indipendente dalla frequenza: clienti occasionali,
; abituali e molto attivi possono sostenere ticket piu alti.
; La quota si applica a tutti i clienti, inclusi quelli inattivi nella storia.
[VALORE_ECONOMICO]
quota_clienti_ticket_premium = 0.15
moltiplicatore_ticket_premium = 2.50


[SEMANTIC_ANALYSIS]

output_data = docs/report